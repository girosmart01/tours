<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sri Lanka Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="palm-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="28" height="28">
          <path fill="currentColor" d="M20 38V20M20 20c-3-6-9-8-14-6 3 5 8 7 14 6Zm0 0c3-6 9-8 14-6-3 5-8 7-14 6Zm0-2c-1-6-6-10-12-10 2 6 6 9 12 10Zm0 0c1-6 6-10 12-10-2 6-6 9-12 10Zm0-2c1-5 5-9 10-10-1 5-4 9-10 10Z"/>
        </svg>
      </span>
      <div class="topbar-text">
        <span class="topbar-title">SRI LANKA TOURS</span>
        <span class="topbar-sub">Экскурсии с русским гидом</span>
      </div>
    </header>

    <main id="content" class="content" role="main"></main>

    <nav class="tabbar" role="tablist" aria-label="Разделы">
      <button class="tab-btn" data-tab="tours" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 5a1.25 1.25 0 1 1 0 2.5A1.25 1.25 0 0 1 12 7Zm1.25 10.5h-2.5v-7h2.5v7Z" opacity="0"/><path fill="currentColor" d="M12 2 2 7v6c0 5.1 3.9 9 10 11 6.1-2 10-5.9 10-11V7L12 2Zm0 3.3 7 3.5v3.9c0 3.9-2.9 6.9-7 8.4-4.1-1.5-7-4.5-7-8.4V8.8l7-3.5Z"/></svg>
        <span>Туры</span>
      </button>
      <button class="tab-btn" data-tab="faq" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm.75 15h-1.5v-1.5h1.5V17Zm1.55-6.13c-.66.66-1.05 1.05-1.05 2.13h-1.5c0-1.5.6-2.13 1.35-2.88.5-.5.9-.9.9-1.62 0-.9-.75-1.5-1.75-1.5S10 7.6 10 8.5H8.5C8.5 6.7 9.9 5.5 12 5.5s3.5 1.28 3.5 3c0 1.13-.6 1.72-1.2 2.37Z"/></svg>
        <span>Вопросы</span>
      </button>
      <button class="tab-btn" data-tab="reviews" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4 4V6a2 2 0 0 1 0-2Zm2 2v11.2L7.5 15H19V6H6Z"/></svg>
        <span>Отзывы</span>
      </button>
      <button class="tab-btn" data-tab="booking" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm12 8v10H5V10h14Z"/></svg>
        <span>Бронирование</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
